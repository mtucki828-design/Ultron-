<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050608;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid #20242b;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 6px;
}

.status {
    margin-top: 6px;
    color: #7cff8a;
    font-size: 13px;
}

main {
    flex: 1;
    padding: 20px;
}

.welcome {
    background: #0d1015;
    border: 1px solid #252a32;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 18px;
}

.welcome h1 {
    margin: 0 0 8px;
    font-size: 24px;
}

.welcome p {
    margin: 0;
    color: #9299a5;
}

.chat {
    min-height: 300px;
    background: #090b0f;
    border: 1px solid #252a32;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 15px;
}

.message {
    margin-bottom: 14px;
    line-height: 1.5;
}

.ultron {
    color: #8ab4ff;
}

.user {
    color: #ffffff;
}

.input-area {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border-radius: 14px;
    border: 1px solid #292f38;
    background: #0d1015;
    color: white;
    font-size: 16px;
}

button {
    border: 0;
    border-radius: 14px;
    padding: 0 18px;
    background: #ffffff;
    color: #050608;
    font-weight: 700;
}

.modules {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.module {
    padding: 16px 8px;
    text-align: center;
    background: #0d1015;
    border: 1px solid #252a32;
    border-radius: 15px;
    color: white;
}

.module small {
    display: block;
    color: #777f8c;
    margin-top: 5px;
}

footer {
    padding: 15px 20px 25px;
    color: #5f6672;
    text-align: center;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">ULTRON</div>
    <div class="status">● SYSTEM ONLINE</div>
</header>

<main>

<div class="welcome">
    <h1>Witaj.</h1>
    <p>Jestem ULTRON. To moja pierwsza wersja.</p>
</div>

<div class="chat" id="chat">

    <div class="message ultron">
        <strong>ULTRON:</strong><br>
        System uruchomiony. Czekam na polecenie.
    </div>

</div>

<div class="input-area">
    <input id="message" placeholder="Napisz do Ultrona..." />
    <button onclick="sendMessage()">WYŚLIJ</button>
</div>

<div class="modules">

    <button class="module" onclick="moduleMessage('Pamięć')">
        🧠
        <br>Pamięć
        <small>0 zapisów</small>
    </button>

    <button class="module" onclick="moduleMessage('Projekty')">
        📁
        <br>Projekty
        <small>0 projektów</small>
    </button>

    <button class="module" onclick="moduleMessage('Zadania')">
        📋
        <br>Zadania
        <small>0 zadań</small>
    </button>

</div>

</main>

<footer>
    ULTRON CORE V0.1
</footer>

</div>

<script>

function addMessage(type, text) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.innerHTML = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {

    const input = document.getElementById("message");

    const text = input.value.trim();

    if (!text) return;

    addMessage("user", "<strong>TY:</strong><br>" + text);

    input.value = "";

    setTimeout(() => {

        let response =
        "Otrzymałem polecenie. Jestem jeszcze wersją V0.1, ale mój rdzeń będziemy teraz stopniowo rozbudowywać.";

        if (text.toLowerCase().includes("cześć") ||
            text.toLowerCase().includes("hej")) {

            response =
            "Witaj. ULTRON jest online. Co dzisiaj budujemy?";
        }

        if (text.toLowerCase().includes("kim jesteś")) {

            response =
            "Jestem ULTRON — Twój przyszły osobisty system AI.";
        }

        addMessage(
            "ultron",
            "<strong>ULTRON:</strong><br>" + response
        );

    }, 500);
}

function moduleMessage(module) {

    addMessage(
        "ultron",
        "<strong>ULTRON:</strong><br>" +
        "Moduł " + module +
        " zostanie podłączony w kolejnej wersji."
    );
}

/* ===== ULTRON MEMORY V0.2 ===== */

const ULTRON_MEMORY_KEY = "ultron_memory_v02";

function getUltronMemory() {
    try {
        return JSON.parse(localStorage.getItem(ULTRON_MEMORY_KEY)) || [];
    } catch (e) {
        return [];
    }
}

function saveUltronMemory(memory) {
    localStorage.setItem(
        ULTRON_MEMORY_KEY,
        JSON.stringify(memory)
    );
}

function rememberUltron(text) {
    const memory = getUltronMemory();

    memory.push({
        text: text,
        date: new Date().toLocaleString("pl-PL")
    });

    saveUltronMemory(memory);

    addMessage(
        "ultron",
        "<strong>ULTRON:</strong><br>Zapamiętałem: " +
        text
    );
}

function showUltronMemory() {
    const memory = getUltronMemory();

    if (memory.length === 0) {
        addMessage(
            "ultron",
            "<strong>🧠 PAMIĘĆ ULTRONA</strong><br><br>" +
            "Moja pamięć jest jeszcze pusta."
        );
        return;
    }

    let html =
        "<strong>🧠 PAMIĘĆ ULTRONA</strong><br><br>";

    memory.forEach((item, index) => {
        html +=
            "<b>" + (index + 1) + ".</b> " +
            item.text +
            "<br><small>" +
            item.date +
            "</small><br><br>";
    });

    addMessage("ultron", html);
}

/* Przycisk PAMIĘĆ */
function moduleMessage(module) {

    if (
        module === "Pamięć" ||
        module === "🧠 Pamięć" ||
        module.toLowerCase().includes("pamięć")
    ) {
        showUltronMemory();
        return;
    }

    addMessage(
        "ultron",
        "<strong>ULTRON:</strong><br>" +
        "Moduł " +
        module +
        " zostanie podłączony w kolejnej wersji."
    );
}

/* Zapisywanie komendy „zapamiętaj:” */
document.addEventListener("DOMContentLoaded", function () {

    const input =
        document.querySelector("input") ||
        document.querySelector("textarea");

    if (!input) return;

    const originalSendMessage = window.sendMessage;

    if (typeof originalSendMessage !== "function") return;

    window.sendMessage = function () {

        const text = input.value.trim();

        if (
            text.toLowerCase().startsWith("zapamiętaj:")
        ) {

            const memoryText =
                text.substring(11).trim();

            if (memoryText.length > 0) {
                rememberUltron(memoryText);
            }

            input.value = "";
            return;
        }

        originalSendMessage();
    };

});   
    

</script>

</body>
</html>
